name: Build and Deploy Django to Azure Web App - django-backend

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      # Checkout repo
      - name: Checkout code
        uses: actions/checkout@v4

      # Setup Python
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      # Install dependencies (build validation)
      - name: Install dependencies
        run: |
          cd django_backend
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # Collect static files
      - name: Collect static files
        run: |
          cd django_backend
          python manage.py collectstatic --noinput

      # Create deployment package
      - name: Create deployment package
        run: |
          cd django_backend
          zip -r release.zip .

      # Upload artifact
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: python-app
          path: django_backend/release.zip

  deploy:
    runs-on: ubuntu-latest
    needs: build

    steps:
      # Download artifact
      - name: Download artifact
        uses: actions/download-artifact@v4
        with:
          name: python-app

      # Unzip
      - name: Unzip package
        run: unzip release.zip

      # Deploy to Azure
      - name: Deploy to Azure Web App
        uses: azure/webapps-deploy@v3
        with:
          app-name: 'django-backend'
          slot-name: 'Production'
          publish-profile: ${{ secrets.AZUREAPPSERVICE_PUBLISHPROFILE_FA97F690C98A4EB09C2F7FCC90F5F74A }}
          package: .